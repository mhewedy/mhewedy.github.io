name: build adocs

on:
  push:
    branches:
      - master
jobs:
  adoc_build:
    runs-on: ubuntu-latest
    name: generate html and push to to gh-pages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build html and pdf
        run: |
          gem install asciidoctor
          gem install asciidoctor-pdf -v 2.3.19
          asciidoctor --backend=html5 -o cv.html cv.adoc
          asciidoctor-pdf -a allow-uri-read -o mhewedy_cv.pdf cv.adoc
          asciidoctor --backend=html5 -o index.html index.adoc
      - name: Deploy docs to ghpages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
